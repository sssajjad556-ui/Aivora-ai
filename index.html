<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVORA AI STUDIO</title>
    <style>
        body { background-color: #0b0b12; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 450px; margin: auto; background: #161625; padding: 20px; border-radius: 20px; }
        
        /* বাটন ডিজাইনের জন্য স্টাইল */
        .grid-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .option-box { background: #252545; padding: 10px; border-radius: 8px; border: 1px solid #444; cursor: pointer; font-size: 11px; transition: 0.3s; }
        .option-box.active { background: #ff3e6c; border-color: #fff; }
        
        textarea { width: 90%; height: 80px; padding: 10px; background: #1a1a2e; border: 1px solid #444; border-radius: 10px; color: #fff; margin-bottom: 20px; }
        .media-btns { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .icon-btn { width: 60px; height: 60px; background: #252545; border: 1px solid #444; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        button { background: linear-gradient(90deg, #ff3e6c, #ff9e00); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .preview-box { width: 100%; height: 150px; background: #000; border: 2px dashed #444; margin-top: 20px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>AIVORA AI STUDIO</h2>

    <div class="grid-options">
        <div class="option-box" onclick="select(this)">Grok AI</div>
        <div class="option-box" onclick="select(this)">Veo 3</div>
        <div class="option-box" onclick="select(this)">Veo 2 Ultra</div>
    </div>

    <div class="grid-options">
        <div class="option-box" onclick="select(this)">4s</div>
        <div class="option-box" onclick="select(this)">6s</div>
        <div class="option-box" onclick="select(this)">8s</div>
    </div>

    <div class="grid-options">
        <div class="option-box" onclick="select(this)">480p</div>
        <div class="option-box" onclick="select(this)">720p</div>
        <div class="option-box" onclick="select(this)">1080p</div>
    </div>

    <textarea placeholder="Describe the content you want to create..."></textarea>

    <button onclick="window.open('https://www.profitablecreativeformat.com/g89y67u6757657657', '_blank')">WATCH AD & GENERATE VIDEO</button>

    <div class="preview-box">Video Preview Area</div>
</div>

<script>
    function select(element) {
        // বাটন সিলেক্ট করলে কালার চেঞ্জ হবে
        element.parentElement.querySelectorAll('.option-box').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }
</script>

</body>
</html>
