<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVORA AI STUDIO</title>
    <style>
        body { background-color: #0b0b12; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1a1a2e; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #e91e63; margin-bottom: 5px; }
        input[type="file"] { width: 90%; padding: 10px; margin: 15px 0; background: #252545; border: 1px solid #444; border-radius: 8px; color: white; }
        textarea { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #252545; color: white; resize: none; }
        button { background: #e91e63; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        button:hover { background: #c2185b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👑 AIVORA AI STUDIO 👑</h1>
        <p>আপনার প্রফেশনাল এআই ভিডিও জেনারেটর</p>
        <input type="file" accept="image/*">
        <textarea placeholder="আপনার ভিডিওর বিবরণ এখানে লিখুন..." rows="4"></textarea>
        <button>ভিডিও জেনারেট করুন</button>
    </div>
</body>
</html>
